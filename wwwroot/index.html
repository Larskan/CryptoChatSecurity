<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Super Secure Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
</head>
<body>
    <h2>Super Secure Chat</h2>
    <div>
        <input type="text" id="username" placeholder="Enter your name" />
        <input type="text" id="message" placeholder="Type a message" />
        <button onclick="sendMessage()">Send</button>
    </div>
    <ul id="messagesList"></ul>

    <script src="js/encryption.js"></script>

    <script>
        // SignalR Connection
        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/chatHub")
            .build();

        connection.on("ReceiveMessage", async (user, encryptedMessage, nonce, tag) => {
            const decryptedMessage = await decryptMessage(encryptedMessage, nonce, tag);

            // List item to display decrypted message
            // TODO: This can be prettier.
            const li = document.createElement("li");
            li.textContent = `${user}: ${decryptedMessage}`;
            document.getElementById("messagesList").appendChild(li);
        });

        connection.start().then(() => {
            console.log("SignalR Connection established.");
        }).catch(err => {
            console.error("SignalR connection failed", err);
        });

        async function sendMessage() {
            const user = document.getElementById("username").value;
            const message = document.getElementById("message").value;

            if (!message) return;

            // Encrypt the message and get the encrypted message, nonce and tag
            const { encryptedMessage, nonce, tag } = await encryptMessage(message);

            console.log("Message before sending:", {
                user,
                encryptedMessage,
                nonce,
                tag
            });
            //send the encrypted message, nonce and tag to the server
            connection.invoke("SendMessage", user, encryptedMessage, nonce, tag).catch(err => console.error("Error sending message: ", err));

            // Clear the message input
            document.getElementById("message").value = "";
        }
    </script>
</body>
</html>
